[project]
name = "reconiq"
version = "1.0.0"
description = "ReconIQ Enterprise — AI Finance Control Center for Payment, Settlement & Ledger Reconciliation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "splink>=4.0.0",
    "polars>=1.0.0",
    "pandas>=2.2.0",
    "duckdb>=1.0.0",
    "razorpay>=1.4.0",
    "openai>=1.40.0",
    "google-genai>=0.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "cryptography>=43.0.0",
    "structlog>=24.4.0",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "faker>=26.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.setuptools]
packages = ["llm", "data", "apps", "audit", "matching", "database", "ingestion", "accounting", "exceptions", "settlements", "data_quality"]
