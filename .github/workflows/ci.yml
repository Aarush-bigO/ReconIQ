name: ReconIQ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reconiq
          POSTGRES_PASSWORD: reconiq
          POSTGRES_DB: reconiq
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run linter
        run: ruff check .

      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://reconiq:reconiq@localhost:5432/reconiq

      - name: Run tests
        run: pytest tests/ -v --cov=. --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://reconiq:reconiq@localhost:5432/reconiq
          APP_ENV: test
          SECRET_KEY: test-secret-key

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
